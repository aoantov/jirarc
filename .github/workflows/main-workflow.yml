name: "JiraRC Release Workflow"

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test-plan-deploy:
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: "Release new version"
        uses: cycjimmy/semantic-release-action@v3
        with:
          branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_URL: "https://github.com/aoantov/jirarc.git"
